aid: rhizome-ai
name: Rhizome Ai
description: >-
  Rhizome AI is an AI-powered regulatory research platform for pharmaceutical
  and medical device companies. It lets regulatory affairs teams ask questions
  and receive cited answers grounded in primary-source documents from health
  authorities worldwide (FDA, EMA, Health Canada, Swissmedic, MHRA, TGA and
  others across 10+ agencies), retrieving from up to a thousand documents
  without hallucinating. Beyond the web application, Rhizome AI publishes an
  enterprise HTTP API that exposes BM25 keyword search across the regulatory
  document corpus and full-text, page-by-page document retrieval, authenticated
  with an x-api-key header. A YC-backed company, Rhizome AI was surfaced as a
  portfolio-company lead and enriched from its public developer documentation.
